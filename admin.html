<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MZUNGU Cakes | Admin Orders</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <style>
    :root{--ivory:#faf3ec;--paper:#fffdfb;--plum:#3d1f3a;--soft:#5b3a57;--wine:#5c1a32;--line:rgba(61,31,58,.16);}
    *{box-sizing:border-box} body{margin:0;background:var(--ivory);color:var(--plum);font:15px/1.5 Inter,Arial,sans-serif}.hidden{display:none!important}
    .wrap{max-width:1100px;margin:0 auto;padding:0 24px}.top{border-bottom:1px solid var(--line);padding:22px 0}.top-inner{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font:600 25px Georgia,serif;color:var(--wine)}
    button,.input{font:inherit}.button{border:0;border-radius:8px;padding:11px 16px;background:var(--wine);color:white;cursor:pointer;font-weight:600}.button.secondary{background:transparent;border:1px solid var(--line);color:var(--plum)}
     main{padding:38px 0}.login,.dashboard{max-width:100%}.login{max-width:420px;margin:50px auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px}.login h1{margin-top:0;font:600 29px Georgia,serif}.field{display:block;margin:16px 0 6px;font-weight:600}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:white}.login .button{width:100%;margin-top:18px}.error{color:#a3263b;margin:12px 0 0}.dashboard-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}.dashboard h1{font:600 34px Georgia,serif;margin:0}.muted{color:var(--soft)}.orders{display:grid;gap:16px}.order{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.order h2{font:600 19px Georgia,serif;margin:0 0 3px}.order-meta{color:var(--soft);font-size:13px}.status{border:1px solid var(--line);border-radius:7px;padding:8px;background:white;color:var(--plum);font-weight:600}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0;padding-top:16px;border-top:1px solid var(--line)}.details strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}.items{margin:0;padding-left:18px;color:var(--soft)}.empty{padding:40px;text-align:center;background:var(--paper);border:1px dashed var(--line);border-radius:14px;color:var(--soft)}.catalog{margin-bottom:42px}.catalog-form,.catalog-item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}.catalog-form{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px;margin-bottom:18px}.catalog-form h2,.catalog-form .form-actions,.catalog-form .catalog-message{grid-column:1/-1}.catalog-form h2{font:600 25px Georgia,serif;margin:0 0 4px}.catalog-form textarea{min-height:90px;resize:vertical}.check{display:flex;gap:8px;align-items:center;margin:16px 0}.catalog-list{display:grid;gap:12px}.catalog-item{display:flex;justify-content:space-between;gap:18px;align-items:start}.catalog-item h3{margin:0 0 3px;font:600 19px Georgia,serif}.catalog-item img{width:64px;height:64px;object-fit:cover;border-radius:8px;float:left;margin-right:12px}.catalog-actions{display:flex;gap:8px;flex-shrink:0}.form-actions{display:flex;gap:10px;margin-top:8px}.catalog-message{min-height:20px}.catalog-message.error{color:#a3263b}.catalog-message.success{color:#28734d}
     @media(max-width:600px){.top-inner,.dashboard-head,.catalog-item{align-items:flex-start;flex-direction:column}.details,.catalog-form{grid-template-columns:1fr}.order-head{align-items:flex-start;flex-direction:column}.catalog-form h2,.catalog-form .form-actions,.catalog-form .catalog-message{grid-column:auto}.catalog-actions{width:100%}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap top-inner"><div class="brand">MZUNGU Cakes / Admin</div><button class="button secondary hidden" id="logoutBtn">Log out</button></div></header>
  <main class="wrap">
    <section class="login" id="loginPanel">
      <h1>Order dashboard</h1>
      <p class="muted">Sign in to view and manage customer orders.</p>
      <form id="loginForm">
        <label class="field" for="email">Email</label>
        <input class="input" id="email" type="email" required autocomplete="username">
        <label class="field" for="password">Password</label>
        <input class="input" id="password" type="password" required autocomplete="current-password">
        <button class="button" type="submit">Sign in</button>
        <p class="error" id="loginError"></p>
      </form>
    </section>
    <section class="dashboard hidden" id="dashboardPanel">
      <section class="catalog">
        <div class="dashboard-head"><div><h1>Catalog</h1><div class="muted">Manage public products and cake-builder flavours.</div></div><button class="button secondary" id="refreshCatalogBtn" type="button">Refresh catalog</button></div>
        <form class="catalog-form" id="catalogForm">
          <h2 id="catalogFormTitle">Add catalog item</h2>
          <input type="hidden" id="catalogId">
          <label class="field" for="catalogKind">Type</label><select class="input" id="catalogKind"><option value="product">Product</option><option value="flavour">Flavour</option></select>
          <label class="field" for="catalogName">Name</label><input class="input" id="catalogName" required maxlength="80">
          <label class="field" for="catalogCategory">Category</label><input class="input" id="catalogCategory" maxlength="60" placeholder="e.g. Cakes, drinks">
          <label class="field" for="catalogDescription">Description</label><textarea class="input" id="catalogDescription" maxlength="240"></textarea>
          <label class="field" for="catalogPrice">Price (TZS)</label><input class="input" id="catalogPrice" type="number" min="0" step="1">
          <label class="field" for="catalogUnit">Unit</label><input class="input" id="catalogUnit" maxlength="40" placeholder="per dozen, each, tray">
          <label class="field" for="catalogAddon">Flavour addon (TZS)</label><input class="input" id="catalogAddon" type="number" min="0" step="1" value="0">
          <label class="field" for="catalogColor">Flavour colour</label><input class="input" id="catalogColor" type="text" value="#F3E3B8" pattern="^#[0-9a-fA-F]{6}$" placeholder="#F3E3B8">
          <label class="field" for="catalogImage">Image</label><input class="input" id="catalogImage" type="file" accept="image/*">
          <label class="check"><input id="catalogAvailable" type="checkbox" checked> Available on the public site</label>
          <div class="form-actions"><button class="button" type="submit">Save item</button><button class="button secondary" type="button" id="cancelCatalogBtn">Clear</button></div>
          <p class="catalog-message" id="catalogMessage"></p>
        </form>
        <div class="catalog-list" id="catalogList"><div class="empty">Loading catalog...</div></div>
      </section>
      <div class="dashboard-head"><div><h1>Orders</h1><div class="muted" id="orderCount"></div></div><button class="button secondary" id="refreshBtn">Refresh</button></div>
      <div class="orders" id="orders"><div class="empty">Loading orders...</div></div>
    </section>
  </main>
  <script>
    (function(){
      var firebaseConfig = {
        apiKey: 'AIzaSyCBVSoFMfGLsmQwGhE0uU25C7HYFKd2ofk',
        authDomain: 'mzungu-cakes.firebaseapp.com',
        projectId: 'mzungu-cakes',
        storageBucket: 'mzungu-cakes.firebasestorage.app',
        messagingSenderId: '465181508645',
        appId: '1:465181508645:web:91efd6ac88120a290f6bcc'
      };
      firebase.initializeApp(firebaseConfig);
       var auth = firebase.auth();
       var db = firebase.firestore();
       var storage = firebase.storage();
      db.settings({ experimentalForceLongPolling: true });
      var loginPanel = document.getElementById('loginPanel');
      var dashboardPanel = document.getElementById('dashboardPanel');
      var logoutBtn = document.getElementById('logoutBtn');
       var ordersEl = document.getElementById('orders');
       var catalogList = document.getElementById('catalogList');
       var editingCatalog = null;

      document.getElementById('loginForm').addEventListener('submit', function(event){
        event.preventDefault();
        document.getElementById('loginError').textContent = '';
        auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value)
          .catch(function(error){ document.getElementById('loginError').textContent = error.message; });
      });
      logoutBtn.addEventListener('click', function(){ auth.signOut(); });
       document.getElementById('refreshBtn').addEventListener('click', loadOrders);
       document.getElementById('refreshCatalogBtn').addEventListener('click', loadCatalog);
       document.getElementById('cancelCatalogBtn').addEventListener('click', resetCatalogForm);
       document.getElementById('catalogKind').addEventListener('change', updateCatalogFields);
       document.getElementById('catalogForm').addEventListener('submit', saveCatalogItem);

      auth.onAuthStateChanged(function(user){
        var signedIn = !!user;
        loginPanel.classList.toggle('hidden', signedIn);
        dashboardPanel.classList.toggle('hidden', !signedIn);
        logoutBtn.classList.toggle('hidden', !signedIn);
         if (signedIn){ loadOrders(); loadCatalog(); }
      });

       function loadOrders(){
        ordersEl.innerHTML = '<div class="empty">Loading orders...</div>';
        db.collection('orders').orderBy('createdAt', 'desc').get().then(function(snapshot){
          document.getElementById('orderCount').textContent = snapshot.size + ' order' + (snapshot.size === 1 ? '' : 's');
          if (snapshot.empty){ ordersEl.innerHTML = '<div class="empty">No orders yet.</div>'; return; }
          ordersEl.innerHTML = '';
          snapshot.forEach(function(doc){ ordersEl.appendChild(orderCard(doc.id, doc.data())); });
        }).catch(function(error){ ordersEl.innerHTML = '<div class="empty">Could not load orders: '+escapeHTML(error.message)+'</div>'; });
       }

       function loadCatalog(){
         catalogList.innerHTML = '<div class="empty">Loading catalog...</div>';
         db.collection('catalog').get().then(function(snapshot){
           if (snapshot.empty){ catalogList.innerHTML = '<div class="empty">No catalog items yet.</div>'; return; }
           var docs = []; snapshot.forEach(function(doc){ docs.push({id:doc.id, data:doc.data()}); });
           docs.sort(function(a,b){ return String(a.data.kind || '').localeCompare(String(b.data.kind || '')) || String(a.data.name || '').localeCompare(String(b.data.name || '')); });
           catalogList.innerHTML = ''; docs.forEach(function(item){ catalogList.appendChild(catalogCard(item.id, item.data)); });
         }).catch(function(error){ catalogList.innerHTML = '<div class="empty">Could not load catalog: '+escapeHTML(error.message)+'</div>'; });
       }

       function catalogCard(id, item){
         var card = document.createElement('article'); card.className = 'catalog-item';
         var price = item.price ? ' · TZS '+Number(item.price).toLocaleString('en-US')+(item.unit ? ' / '+item.unit : '') : '';
         card.innerHTML = (item.image ? '<img src="'+escapeHTML(item.image)+'" alt="">' : '') + '<div><h3>'+escapeHTML(item.name || 'Untitled')+'</h3><div class="order-meta">'+escapeHTML(item.kind || '')+' · '+(item.available === false ? 'Unavailable' : 'Available')+escapeHTML(price)+'</div><div>'+escapeHTML(item.description || '')+'</div></div><div class="catalog-actions"><button class="button secondary edit-catalog" type="button">Edit</button><button class="button secondary delete-catalog" type="button">Delete</button></div>';
         card.querySelector('.edit-catalog').addEventListener('click', function(){ fillCatalogForm(id, item); });
         card.querySelector('.delete-catalog').addEventListener('click', function(){ if (confirm('Delete '+(item.name || 'this item')+'?')) db.collection('catalog').doc(id).delete().then(loadCatalog); });
         return card;
       }

       function updateCatalogFields(){
         var flavour = document.getElementById('catalogKind').value === 'flavour';
         document.getElementById('catalogAddon').disabled = !flavour;
         document.getElementById('catalogColor').disabled = !flavour;
       }
       function resetCatalogForm(){ editingCatalog = null; document.getElementById('catalogForm').reset(); document.getElementById('catalogId').value = ''; document.getElementById('catalogAvailable').checked = true; document.getElementById('catalogFormTitle').textContent = 'Add catalog item'; document.getElementById('catalogMessage').textContent = ''; updateCatalogFields(); }
       function fillCatalogForm(id, item){
         editingCatalog = id; document.getElementById('catalogId').value = id; document.getElementById('catalogKind').value = item.kind || 'product'; document.getElementById('catalogName').value = item.name || ''; document.getElementById('catalogCategory').value = item.category || ''; document.getElementById('catalogDescription').value = item.description || ''; document.getElementById('catalogPrice').value = item.price || ''; document.getElementById('catalogUnit').value = item.unit || ''; document.getElementById('catalogAddon').value = item.addon || 0; document.getElementById('catalogColor').value = item.color || '#F3E3B8'; document.getElementById('catalogAvailable').checked = item.available !== false; document.getElementById('catalogFormTitle').textContent = 'Edit catalog item'; updateCatalogFields(); window.scrollTo(0, 0);
       }
       function saveCatalogItem(event){
         event.preventDefault();
         var kind = document.getElementById('catalogKind').value, name = document.getElementById('catalogName').value.trim(), file = document.getElementById('catalogImage').files[0], message = document.getElementById('catalogMessage');
         message.className = 'catalog-message'; message.textContent = 'Saving...';
         var data = {kind:kind, name:name, category:document.getElementById('catalogCategory').value.trim(), description:document.getElementById('catalogDescription').value.trim(), price:Number(document.getElementById('catalogPrice').value || 0), unit:document.getElementById('catalogUnit').value.trim(), available:document.getElementById('catalogAvailable').checked, updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
         if (kind === 'flavour'){ data.addon = Number(document.getElementById('catalogAddon').value || 0); data.color = document.getElementById('catalogColor').value.trim(); }
         var ref = editingCatalog ? db.collection('catalog').doc(editingCatalog) : db.collection('catalog').doc();
         var upload = file ? storage.ref('catalog/'+ref.id+'-'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g, '_')).put(file).then(function(snapshot){ return snapshot.ref.getDownloadURL(); }) : Promise.resolve(null);
         upload.then(function(image){ if (image) data.image = image; return ref.set(data, {merge:true}); }).then(function(){ resetCatalogForm(); message.className = 'catalog-message success'; message.textContent = 'Catalog item saved.'; loadCatalog(); }).catch(function(error){ message.className = 'catalog-message error'; message.textContent = error.message; });
       }

      function orderCard(id, order){
        var card = document.createElement('article'); card.className = 'order';
        var customer = order.customer || {};
        var items = order.items || [];
        var created = order.createdAt && order.createdAt.toDate ? order.createdAt.toDate().toLocaleString() : 'Just submitted';
        card.innerHTML = '<div class="order-head"><div><h2>'+escapeHTML(order.reference || id)+'</h2><div class="order-meta">Submitted '+escapeHTML(created)+'</div></div><select class="status" aria-label="Order status"><option>New</option><option>Confirmed</option><option>Ready</option><option>Completed</option></select></div>' +
          '<div class="details"><div><strong>Customer</strong>'+escapeHTML(customer.name || '')+'</div><div><strong>Phone</strong>'+escapeHTML(customer.phone || '')+'</div><div><strong>Fulfilment</strong>'+escapeHTML(order.fulfilment || '')+'</div><div><strong>Date needed</strong>'+escapeHTML(order.dateNeeded || '')+'</div><div><strong>Address</strong>'+escapeHTML(order.address || 'Pickup at counter')+'</div><div><strong>Total</strong>TZS '+Number(order.subtotal || 0).toLocaleString('en-US')+'</div></div>' +
          '<strong>Items</strong><ul class="items">'+items.map(function(item){ return '<li>'+escapeHTML(item.title+' - '+item.meta+' - TZS '+Number(item.price || 0).toLocaleString('en-US'))+'</li>'; }).join('')+'</ul>' +
          (order.notes ? '<p><strong>Notes:</strong> '+escapeHTML(order.notes)+'</p>' : '');
        var status = card.querySelector('.status'); status.value = order.status || 'New';
        status.addEventListener('change', function(){ db.collection('orders').doc(id).update({status:status.value}); });
        return card;
      }
      function escapeHTML(value){ var div=document.createElement('div'); div.textContent=String(value); return div.innerHTML; }
    })();
  </script>
</body>
</html>
